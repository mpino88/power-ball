# Render Blueprint - despliegue gratis del bot
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: power-ball-bot
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 12zXYV7G9Pg3n3_Fu-pMG67z6xGUlSbuY-Yfa94bzrI8
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # O en lugar de JSON: GOOGLE_SERVICE_ACCOUNT_EMAIL + GOOGLE_PRIVATE_KEY
      - key: GEMINI_API_KEY
        sync: false
      # Clave de Google AI Studio para "Crear Adivinanza": https://aistudio.google.com/app/apikey
      - key: REQUEST_ACCESS_LINK
        sync: false
      # Enlace al chat/grupo para solicitar acceso (ej: t.me/mi_grupo). Sin esto no se muestra botón.
      # ── PostgreSQL (Internal URL — solo funciona dentro de Render) ─────────────
      # Valor: postgresql://ballbot:<PASSWORD>@dpg-d70k07ruibrs73cj5300-a/ballbot_db
      # IMPORTANTE: Usar Internal URL (sin .oregon-postgres.render.com) para latencia <1ms y sin SSL
      - key: DATABASE_URL
        sync: false
      # false = sin SSL en red interna de Render. true = solo para External URL (local/dev)
      - key: DATABASE_SSL
        value: "false"
